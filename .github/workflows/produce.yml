name: Produce video

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Monday and Thursday, 06:17 UTC (07:17 Algeria)
  workflow_dispatch:
    inputs:
      mode:
        description: "list = show matches to choose from, full = make + upload as private, no-upload = make files only, dry-run = sample match"
        default: "list"
        type: choice
        options: [list, full, no-upload, dry-run]
      match:
        description: "Which match? Team names (e.g. Arsenal Chelsea) or the match number from the list. Empty = next in data/queue.txt"
        default: ""
        type: string
      look_back_days:
        description: "How many days back to look for matches (empty = value in config.yaml)"
        default: ""
        type: string

permissions:
  contents: write   # to save data/history.json (which matches were already covered)

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install motion-graphics engine (Remotion)
        working-directory: video
        run: npm ci && npx remotion browser ensure

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOK_BACK_DAYS: ${{ github.event.inputs.look_back_days }}
          REMOTION_CONCURRENCY: "4"
          MATCH: ${{ github.event.inputs.match }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "list" ]; then python -m pipeline.main --list
          elif [ "$MODE" = "dry-run" ]; then python -m pipeline.main --dry-run
          elif [ "$MODE" = "no-upload" ]; then python -m pipeline.main --no-upload --pick "$MATCH"
          else python -m pipeline.main --pick "$MATCH"; fi

      - name: Show the model's reply if the run failed
        if: failure()
        run: |
          if [ -f out/last_llm_reply.txt ]; then
            echo "Length: $(wc -c < out/last_llm_reply.txt) characters"
            echo "----- START -----"; head -c 3000 out/last_llm_reply.txt
            echo; echo "----- END -----"; tail -c 1500 out/last_llm_reply.txt
          fi

      - name: Keep the files for 14 days (video, script, thumbnails, fact-check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-files
          path: |
            out/**/video.mp4
            out/**/*.json
            out/*.txt
            out/**/*.srt
            out/**/thumbnail_*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: success()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update match history and queue" && git push)
