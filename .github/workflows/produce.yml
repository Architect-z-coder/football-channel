name: Produce video

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Monday and Thursday, 06:17 UTC (07:17 Algeria)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = upload as private, no-upload = make files only, dry-run = sample match"
        default: "full"
        type: choice
        options: [full, no-upload, dry-run]

permissions:
  contents: write   # to save data/history.json (which matches were already covered)

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "dry-run" ]; then python -m pipeline.main --dry-run
          elif [ "$MODE" = "no-upload" ]; then python -m pipeline.main --no-upload
          else python -m pipeline.main; fi

      - name: Keep the files for 14 days (video, script, thumbnails, fact-check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-files
          path: |
            out/**/video.mp4
            out/**/*.json
            out/**/*.srt
            out/**/thumbnail_*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: success()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Record covered match" && git push)
