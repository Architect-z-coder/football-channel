name: probe
on:
  push:
    paths: ["data/probe/request.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/sofascore_probe.py $(cat data/probe/request.txt)
      - run: |
          git config user.name "Architect-z-coder"
          git config user.email "177468583+Architect-z-coder@users.noreply.github.com"
          git add data/probe && git commit -m "Probe result" && git pull --rebase && git push || true
