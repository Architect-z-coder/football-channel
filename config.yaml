# Channel settings. Edit these, not the code.

channel:
  name: "The Other Touchline"          # working name; change when the brand is final
  tagline: "Modern football, explained."
  language: en

# Competitions the Scout watches. IDs are API-Football league IDs.
# Season = the year the season started (2026 for 2026/27).
competitions:
  - { id: 39,  name: "Premier League",   season: 2026, weight: 1.0 }
  - { id: 2,   name: "Champions League", season: 2026, weight: 1.0 }
  - { id: 140, name: "La Liga",          season: 2026, weight: 0.8 }
  - { id: 135, name: "Serie A",          season: 2026, weight: 0.7 }
  - { id: 78,  name: "Bundesliga",       season: 2026, weight: 0.7 }
  - { id: 61,  name: "Ligue 1",          season: 2026, weight: 0.7 }

# National teams always considered when they play (searched by name).
priority_teams:
  - { name: "Algeria", bonus: 1.5 }

scout:
  look_back_days: 4        # only matches that finished in the last N days
  min_score: 1.0           # skip the run if no match scores at least this

writer:
  model: "claude-sonnet-5-5"
  target_minutes: 6        # data-only videos; longer formats come with the research agent
  words_per_minute: 140

voice:
  model_id: "eleven_multilingual_v2"

youtube:
  category_id: "17"        # Sports
  privacy: "private"       # always private: you approve before publishing
  made_for_kids: false

# Topics the pipeline must never cover.
banned_topics:
  - politics
  - transfer rumours
  - betting or odds
  - injuries speculation
  - referees' or players' private lives
