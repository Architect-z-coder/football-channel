# Channel settings. Edit these, not the code.

channel:
  name: "The Other Touchline"          # working name; change when the brand is final
  tagline: "Modern football, explained."
  language: en

# Where match data comes from:
#   football-data   = football-data.org free tier (current season; scores, tables, form)
#   api-football    = API-Football (needs the paid Pro plan for the current season; adds
#                     possession, shots, lineups, goal events)
data_source: football-data

# Add shot maps and xG from Understat (unofficial source; big five leagues only).
# If Understat is unavailable, videos are made without shot data.
understat: true

# How videos are drawn:
#   motion = animated motion graphics (Remotion): counting numbers, growing bars,
#            word-by-word captions, transitions, sound hits
#   slides = still images with a slow zoom (old, faster fallback)
render_engine: motion

# Competitions the Scout watches.
#   code = football-data.org code; id/season = API-Football league ID and season start year.
competitions:
  - { code: PL,  id: 39,  name: "Premier League",   season: 2026, weight: 1.0 }
  - { code: CL,  id: 2,   name: "Champions League", season: 2026, weight: 1.0, has_table: true }
  - { code: PD,  id: 140, name: "La Liga",          season: 2026, weight: 0.8 }
  - { code: SA,  id: 135, name: "Serie A",          season: 2026, weight: 0.7 }
  - { code: BL1, id: 78,  name: "Bundesliga",       season: 2026, weight: 0.7 }
  - { code: FL1, id: 61,  name: "Ligue 1",          season: 2026, weight: 0.7 }

# National teams always considered when they play (API-Football only; national-team
# friendlies and qualifiers are not in football-data.org's free tier).
priority_teams:
  - { name: "Algeria", bonus: 1.5 }

scout:
  look_back_days: 7        # only matches that finished in the last N days
  min_score: 1.0           # skip the run if no match scores at least this

writer:
  model: "claude-sonnet-5-5"
  target_minutes: 6        # data-only videos; longer formats come with the research agent
  words_per_minute: 140

critic:              # second AI pass that judges the hook and pacing, then rewrites once if weak
  enabled: true
  min_hook: 8        # 1-10
  min_other: 7       # payoff, pace, clarity

shorts:              # vertical clips made from each match video, uploaded as private too
  enabled: true
  count: 2

voice:
  model_id: "eleven_multilingual_v2"

youtube:
  category_id: "17"        # Sports
  privacy: "private"       # always private: you approve before publishing
  made_for_kids: false

# Topics the pipeline must never cover.
banned_topics:
  - politics
  - transfer rumours
  - betting or odds
  - injuries speculation
  - referees' or players' private lives
